name: Import verified source
on:
  push:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source
        run: |
          curl -fsSL https://inference-chip-index-source.assorted-client-a65.workers.dev/source.tar.gz -o /tmp/source.tar.gz
          test "$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)" = "4d070abc6f9ef4c8f884fe965bff6ca06b056f651bc1590055caa235275d1002"
          tar -xzf /tmp/source.tar.gz
          rm -f .github/workflows/import-source.yml
      - name: Commit source
        run: |
          git config user.name "Reprocraft LATAM"
          git config user.email "reprocraftlatam@proton.me"
          git add -A
          git commit -m "Import verified Inference Chip Index source"
          git push
